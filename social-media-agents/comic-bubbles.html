<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comic Sprechblasen – Haus aus Glas</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f0f0f;
        color: #fff;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }
      .hint {
        color: #c4c4c4;
        margin: 0 0 12px;
      }
      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background-image: url("https://github.com/user-attachments/assets/3f5e6441-3e57-4f40-b023-21f6b2d87b16");
        background-size: cover;
        background-position: center;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #333;
      }
      .bubble {
        position: absolute;
        background: rgba(255, 255, 255, 0.93);
        color: #121212;
        padding: 10px 12px;
        border-radius: 14px;
        max-width: 280px;
        font-weight: 700;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      }
      .b1 {
        top: 7%;
        left: 5%;
      }
      .b2 {
        top: 18%;
        right: 5%;
      }
      .title {
        position: absolute;
        left: 50%;
        bottom: 7%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 11px 16px;
        border-radius: 10px;
        text-align: center;
      }
      .title strong {
        display: block;
        font-size: 1.2rem;
        letter-spacing: 0.04em;
      }
      .title span {
        font-size: 0.9rem;
        color: #d6d6d6;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Comic Sprechblasen (Preview)</h1>
      <p class="hint">
        Diese Seite ist als schnelle Link-Preview gedacht. Für Instagram exportiere das Bild
        am besten in Canva/CapCut mit gleichen Texten.
      </p>
      <div class="stage">
        <div class="bubble b1">Ich war weg.</div>
        <div class="bubble b2">Nicht gebrochen.</div>
        <div class="title">
          <strong>HAUS AUS GLAS</strong>
          <span>Coming Soon</span>
        </div>
      </div>
    </div>
  </body>
</html>
